# Before the initramfs is built: turn the copied live system into a normal one.
---
dontChroot: true
timeout: 300
script:
    # the kernel normally comes along with the live system's files; make sure
    - command: "test -f ${ROOT}/boot/vmlinuz-linux-cachyos-lts || cp /run/archiso/bootmnt/arch/boot/x86_64/vmlinuz-linux-cachyos-lts ${ROOT}/boot/"
    # live-only boot hooks (the installed system boots from its disk)
    - "rm -f ${ROOT}/etc/mkinitcpio.conf.d/archiso.conf"
    # live-only services: the RAM-only pacman key store (an installed system
    # must keep its keys), the live user, automatic login, passwordless sudo
    - "rm -f ${ROOT}/etc/systemd/system/etc-pacman.d-gnupg.mount ${ROOT}/etc/systemd/system/pacman-init.service ${ROOT}/etc/systemd/system/multi-user.target.wants/pacman-init.service"
    - "rm -f ${ROOT}/etc/systemd/system/slozos-pro-live-setup.service ${ROOT}/etc/systemd/system/multi-user.target.wants/slozos-pro-live-setup.service ${ROOT}/usr/local/bin/slozos-pro-live-setup"
    - "rm -f ${ROOT}/etc/sddm.conf.d/90-live-autologin.conf ${ROOT}/etc/sudoers.d/10-live"
    # live-only system settings (logs in RAM, never sleep, …)
    - "rm -f ${ROOT}/etc/systemd/journald.conf.d/volatile-storage.conf ${ROOT}/etc/systemd/logind.conf.d/do-not-suspend.conf ${ROOT}/etc/systemd/resolved.conf.d/archiso.conf ${ROOT}/etc/systemd/system-generators/systemd-gpt-auto-generator"
    - "rm -rf ${ROOT}/etc/pacman.d/gnupg"
