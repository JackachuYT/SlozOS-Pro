# Last steps inside the new system: package signing keys, and the installer
# itself goes (it's only needed on the USB stick).
---
dontChroot: false
timeout: 600
script:
    - "pacman-key --init"
    - "pacman-key --populate"
    - "pacman -Rdd --noconfirm calamares slozos-pro-installer mkinitcpio-archiso || true"
