---
defaultGroups:
    - name: wheel
      must_exist: true
    - audio
    - video
    - input
    - network
    - storage
    - optical
    - lp
sudoersGroup: wheel
sudoersConfigureWithGroup: true
setRootPassword: false
doReusePassword: true
doAutologin: false
autologinGroup: autologin
passwordRequirements:
    minLength: 1
    maxLength: -1
allowWeakPasswords: true
allowWeakPasswordsDefault: true
user:
    shell: /usr/bin/zsh
    forbidden_names: [ root, live ]
hostname:
    location: EtcFile
    writeHostsFile: true
    template: "${first}-slozos-pro"
