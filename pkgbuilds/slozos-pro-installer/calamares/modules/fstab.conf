---
crypttabOptions: luks
tmpOptions:
    default: ""
    ssd: "defaults,noatime,mode=1777"
mountOptions:
    - filesystem: default
      options: [ defaults, noatime ]
    - filesystem: efi
      options: [ defaults, umask=0077 ]
    - filesystem: btrfs
      options: [ defaults, noatime, compress=zstd ]
