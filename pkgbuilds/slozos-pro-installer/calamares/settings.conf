# SlozOS Pro installer (Calamares 3.4). Installs the live system's own files
# (airootfs.sfs), so it works offline, then turns it into a normal install.
---
modules-search: [ local, /usr/lib/calamares/modules ]

instances:
- id: prepare
  module: shellprocess
  config: shellprocess_prepare.conf
- id: finish
  module: shellprocess
  config: shellprocess_finish.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - shellprocess@prepare
  - initcpiocfg
  - initcpio
  - removeuser
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - services-systemd
  - grubcfg
  - bootloader
  - shellprocess@finish
  - umount
- show:
  - finished

branding: slozos-pro
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
