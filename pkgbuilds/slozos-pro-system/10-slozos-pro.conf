# SlozOS Pro login screen: touch-friendly — Wayland greeter with an on-screen
# keyboard (tap a text box, or the keyboard button) and Plasma's Breeze theme,
# which is built for touch, over the SlozOS Pro wallpaper.
[General]
DisplayServer=wayland
InputMethod=qtvirtualkeyboard
GreeterEnvironment=QT_WAYLAND_SHELL_INTEGRATION=layer-shell,QT_IM_MODULE=qtvirtualkeyboard

[Wayland]
CompositorCommand=kwin_wayland --drm --no-lockscreen --no-global-shortcuts --locale1

[Theme]
Current=breeze
