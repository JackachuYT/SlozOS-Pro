# SlozOS Pro package sources.
# [slozos-pro]: SlozOS Pro's own packages (design, touch, branding), published
# with each release on GitHub.
[options]
HoldPkg     = pacman glibc
Architecture = auto
ParallelDownloads = 5
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[slozos-pro]
SigLevel = Optional TrustAll
Server = https://github.com/JackachuYT/SlozOS-Pro/releases/download/repo

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist

# CachyOS: the optimised kernel. Generic x86-64 builds (the v3/v4 repos need
# AVX2, which a Surface Pro 1's Ivy Bridge CPU doesn't have)
[cachyos]
Server = https://mirror.cachyos.org/repo/$arch/$repo

# pearOS NiceC0re: its apps and desktop pieces. Listed after Arch on purpose:
# where pearOS ships its own copy of an Arch package (kscreenlocker, grub,
# filesystem…), Arch's official one is used. pearOS's kscreenlocker fork is
# behind its "lock screen won't let you in" bug (pearOS-archlinux/iso#142).
[pearos]
Server = https://mirror.pearos.xyz/main/$arch/

[inled]
Server = https://apt.inled.es/arch/
