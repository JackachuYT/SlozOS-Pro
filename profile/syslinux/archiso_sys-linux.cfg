LABEL slozos-pro
TEXT HELP
Start SlozOS Pro. From the desktop you can try it out or install it.
ENDTEXT
MENU LABEL Try or Install SlozOS Pro (BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-cachyos-lts
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-cachyos-lts.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet splash loglevel=3 %KERNEL_PARAMS%

LABEL slozos-pro-safe
TEXT HELP
Start SlozOS Pro without graphics drivers, if the screen stays black.
ENDTEXT
MENU LABEL Try or Install SlozOS Pro (safe graphics)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-cachyos-lts
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-cachyos-lts.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% nomodeset %KERNEL_PARAMS%
