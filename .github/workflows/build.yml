name: Build SlozOS Pro theme

# Tests the theme, builds the package on Arch, installs and removes it there,
# and on main publishes it as a release.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build SlozOS Pro
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Test against a pearOS file tree
        run: bash tests/test-theme.sh

      - name: Build the package, install and remove it (Arch Linux)
        run: |
          echo "VERSION=$(cat VERSION)" >> "$GITHUB_ENV"
          docker run --rm -v "$PWD:/src" archlinux:latest bash -euc '
            pacman -Sy --noconfirm --needed base-devel >/dev/null
            useradd -m builder
            cp -r /src/theme /home/builder/theme && chown -R builder: /home/builder/theme
            cd /home/builder/theme
            sed -i "s/^pkgver=.*/pkgver=$(cat /src/VERSION)/; s/^pkgrel=.*/pkgrel=${{ github.run_number }}/" PKGBUILD
            sudo -u builder makepkg -f --noconfirm
            PKG=$(ls slozos-pro-theme-*.pkg.tar.zst)
            cp /usr/lib/os-release /tmp/os-release.before
            pacman -U --noconfirm "$PKG"
            grep -qx "NAME=\"SlozOS Pro\"" /usr/lib/os-release
            echo "installed: $(grep ^PRETTY_NAME /usr/lib/os-release)"
            pacman -R --noconfirm slozos-pro-theme
            cmp /tmp/os-release.before /usr/lib/os-release
            echo "removed: os-release is back to the original"
            mkdir -p /src/out && cp "$PKG" /src/out/'
          ls -lh out

      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: slozos-pro-theme
          path: out/*.pkg.tar.zst

      - name: Publish the release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: |
            **SlozOS Pro theme ${{ env.VERSION }}** for pearOS NiceC0re: pearOS, but it says **SlozOS Pro**. Nothing else changes.

            - The system name is SlozOS Pro (About window, system info, login prompt, boot menu)
            - "About This Pear" in the menu bar becomes "About SlozOS Pro"
            - The pear logo becomes the SloZ sloth (menu bar, About window, boot splash, login splash)

            Wallpapers, apps, settings and updates all stay exactly as pearOS ships them.

            **Install** on pearOS: download `slozos-pro-theme-…pkg.tar.zst`, then in a terminal in that folder:
            ```
            sudo pacman -U slozos-pro-theme-*.pkg.tar.zst
            ```
            Restart to see the new boot splash. pearOS updates don't undo it.

            **Uninstall:** `sudo pacman -R slozos-pro-theme` puts every pearOS name and logo back.
        run: |
          TAG="theme-v$VERSION"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" --title "SlozOS Pro theme $VERSION" --notes "$NOTES" --latest out/*.pkg.tar.zst
