# SlozOS Pro memory tuning for compressed RAM swap (zram, configured in
# /etc/systemd/zram-generator.conf.d/90-slozos-pro.conf): swap to compressed
# RAM early instead of letting the disk thrash, keep file caches longer.
vm.swappiness = 180
vm.page-cluster = 0
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
vm.vfs_cache_pressure = 50
